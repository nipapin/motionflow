name: Motion Flow build and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the main build to motionflow
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: motionflow-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    outputs:
      release_id: ${{ steps.package.outputs.release_id }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      DB_HOST: '127.0.0.1'
      DB_PORT: '1'
      DB_USERNAME: ci_unused
      DB_PASSWORD: ci_unused
      DB_DATABASE: ci_unused
      REDIS_PORT: '1'
      AUTH_SECRET: ci-build-only-not-a-production-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Notify existing Telegram bot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          NOTIFY_STATUS: started
        run: bash deploy/ci-ssh.sh notify
      - name: Load public production build settings
        env:
          BUILD_PUBLIC_ENV: ${{ vars.BUILD_PUBLIC_ENV }}
        run: node scripts/ci-public-env.mjs
      - run: npm ci --include=dev --no-audit --no-fund
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-motionflow-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-motionflow-next-${{ hashFiles('package-lock.json') }}-
      - name: Check deployment scripts and build
        run: |
          for script in deploy/install-release.sh deploy/ci-ssh.sh; do bash -n "$script"; done
          node scripts/test-ci-installer.mjs
          npm run build
      - name: Package Linux runtime and verify WebSocket server
        id: package
        run: |
          export RELEASE_COMMIT="$GITHUB_SHA"
          export RELEASE_ID="$GITHUB_SHA-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          npm prune --omit=dev --no-audit --no-fund
          node scripts/package-ci-release.mjs
          (cd .release && node scripts/verify-ci-release.mjs "$RELEASE_ID")
          node scripts/smoke-ci-release.mjs
          mkdir release-artifacts
          tar -czf release-artifacts/motionflow.tgz -C .release .
          cp deploy/install-release.sh release-artifacts/
          (cd release-artifacts && sha256sum motionflow.tgz > motionflow.tgz.sha256)
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motionflow-${{ steps.package.outputs.release_id }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 5
  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: motionflow-${{ needs.build.outputs.release_id }}
          path: release-artifacts
      - name: Deliver release without building on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_ID: ${{ needs.build.outputs.release_id }}
        run: bash deploy/ci-ssh.sh deploy
